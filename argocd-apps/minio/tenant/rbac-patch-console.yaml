---
# ServiceAccount для PostSync Job, который патчит minio-tenant-console
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio-console-patcher
  namespace: minio-operator
---
# Role: разрешить get/patch Service minio-tenant-console в namespace minio-operator
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: minio-console-patcher
  namespace: minio-operator
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["minio-tenant-console"]
    verbs: ["get", "patch", "update"]
---
# RoleBinding: привязать Role к ServiceAccount minio-console-patcher
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minio-console-patcher
  namespace: minio-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: minio-console-patcher
subjects:
  - kind: ServiceAccount
    name: minio-console-patcher
    namespace: minio-operator
