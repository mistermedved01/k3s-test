---
# ArgoCD PostSync hook: после синхронизации Tenant патчит Service minio-tenant-console
# аннотациями Traefik (HTTPS-бэкенд + ServersTransport), т.к. Operator пересоздаёт Service без них
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-console-patch-traefik
  namespace: minio-operator
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 60
  backoffLimit: 30
  activeDeadlineSeconds: 300
  template:
    spec:
      serviceAccountName: minio-console-patcher
      restartPolicy: OnFailure
      containers:
        - name: patch
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for Service minio-tenant-console..."
              for i in $(seq 1 30); do
                if kubectl get service minio-tenant-console -n minio-operator --request-timeout=5s 2>/dev/null; then
                  echo "Service found, applying Traefik annotations..."
                  kubectl annotate service minio-tenant-console -n minio-operator \
                    traefik.ingress.kubernetes.io/service.serversscheme=https \
                    traefik.ingress.kubernetes.io/service.serverstransport=minio-operator-minio-insecure@kubernetescrd \
                    --overwrite
                  echo "Done."
                  exit 0
                fi
                echo "Attempt $i/30: Service not ready, waiting 10s..."
                sleep 10
              done
              echo "Timeout: Service minio-tenant-console did not appear."
              exit 1
